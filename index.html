<script>
(()=>{
  const started=Date.now(), key='gao-auth-recovery-once';
  const check=()=>{
    const loading=[...document.querySelectorAll('.route-loading')].find(x=>/Carregando acesso/i.test(x.textContent||''));
    if(!loading)return;
    if(Date.now()-started<12000)return;
    if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');}
    if(!document.getElementById('gao-auth-timeout')){
      const box=document.createElement('div');box.id='gao-auth-timeout';box.style='position:fixed;z-index:99999;inset:0;display:grid;place-items:center;background:rgba(8,45,82,.18);font-family:inherit';box.innerHTML='<div style="max-width:420px;padding:24px;border-radius:14px;background:#fff;box-shadow:0 20px 60px rgba(8,45,82,.25);color:#082f55;text-align:center"><h2 style="margin:0 0 8px">Não foi possível atualizar a sessão</h2><p style="margin:0 0 16px;color:#54708e">O acesso ao Portal demorou mais que o esperado. Tente novamente.</p><button type="button" style="border:0;border-radius:8px;padding:10px 16px;background:#3188cc;color:#fff;font-weight:800;cursor:pointer">Tentar novamente</button></div>';box.querySelector('button').onclick=()=>{sessionStorage.removeItem(key);location.reload()};document.body.appendChild(box);
    }
  };
  setInterval(check,1000);
})();
</script>

<script>
(()=>{
  const TARGET='#indicadores-performance';
  const SELECTOR='a[href="/#indicadores-performance"],a[href="/indicadores-performance"],[data-indicators-link]';
  const load=()=>import('/indicators-performance-v176.mjs?v=182').then(m=>m.mount?.()).catch(()=>{});
  const open=(ev)=>{
    const link=ev.target?.closest?.(SELECTOR);
    if(!link)return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    history.pushState({gaoIndicators:true},'',TARGET);
    load();
  };
  document.addEventListener('click',open,true);
  window.addEventListener('hashchange',()=>{if(location.hash===TARGET)load();});
  if(location.hash===TARGET) setTimeout(load,0);
})();
</script>

<script>
(()=>{
  const openIndicators=()=>{
    history.pushState({gaoIndicators:true},'', '/#indicadores-performance');
    import('/indicators-performance-v176.mjs?v=185').then(m=>m.mount?.()).catch(err=>console.error('Indicadores GAO',err));
  };
  document.addEventListener('click',event=>{
    const el=event.target?.closest?.('a,button,[role="link"]');

    event.preventDefault(); event.stopImmediatePropagation(); openIndicators();
  }, true);

})();
