<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicadores — GAO</title><link rel="stylesheet" href="/assets/index-CnNcFroc.css"><style>body{margin:0;background:#f4f8fc;color:#0b355b;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:0 auto;padding:34px}.head{background:linear-gradient(135deg,#073763,#147bb8);color:#fff;border-radius:18px;padding:26px;margin-bottom:18px}.head h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #d6e4ef;border-radius:16px;padding:20px;box-shadow:0 8px 24px #16477612}.card h2{margin:0 0 18px;font-size:18px}.value{font-size:30px;font-weight:800;margin:8px 0}.meta{color:#5b7690;font-size:13px}..ok{color:#137744}..warn{color:#9a6500}.gray{color:#637c94}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="head"><div style="letter-spacing:.16em;font-size:12px;font-weight:800">GESTÃO DE INDICADORES</div><h1>Painel de Indicadores — Gerência de Qualidade</h1><p style="margin:0;color:#dceffc">Dados operacionais transformados em análise, tendência e decisão.</p></section><div class="grid" id="cards"></div><section id="detail" style="margin-top:18px"></section></main><script>const cards=[["Químico","R$ 0,1256","R$ 0,120","Não apurado","Acima da meta","red"],["Relave","2,62%","Não apurado","—","Acima da meta","red"],["SLA entrega","35%","65%","-30 p.p.","Atenção","yellow"],["SLA coleta","0%","Não apurado","—","Sem dados","gray"],["Enxoval","3.172 peças","Não apurado","—","Ação necessária","yellow"],["Rotinas","100%","Não apurado","—","Dentro","green"]];const color={red:"#d92d20",yellow:"#e6a700,green":"#159447",gray:"#98a6b5"};document.getElementById("cards").innerHTML=cards.map(c=>"<article class=\"card\"><h2>"+c[0]+"</h2><div style=\"font-size:11px;color:#637c94\">ATUAL</div><div class=\"value\">"+c[1]+"</div><div class=\"meta\">Meta: "+c[2]+"</div><hr><div style=\"font-size:11px;color:#637c94\">PERÍODO ANTERIOR</div><div style=\"font-size:22px;font-weight:800\">"+c[3]+"</div><strong style=\"color:"+(c[5]==="red"?"#b42318":c[5]==="yellow"?"#946200":c[5]==="green"?"#137744":"#637c94")+"\">"+c[4]+"</strong></article>").join("");document.getElementById("detail").innerHTML="<div class=\"card\"><h2>Decisões necessárias</h2><div class=\"meta\">Comparação atual x período anterior disponível em cada card.</div></div>";</script></body></html>
